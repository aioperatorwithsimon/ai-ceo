<!doctype html>

<!-- Transparent text cards, one per beat (id c1..cN). Text stays above y≈1120 on captioned reels.
     Keep-out: top 240 / bottom 460 / sides 74. See knowledgebase/ReelCraft.md. -->
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1080px; height:1920px; background:transparent; }
  body { font-family: Inter, 'Helvetica Neue', Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  .card { position:absolute; inset:0; display:none; }
  .card.on { display:block; }
  .veil { position:absolute; inset:0; background:rgba(11,11,15,0.62); }
  .shade { position:absolute; left:0; right:0; bottom:0; height:1300px;
    background:linear-gradient(to top, rgba(11,11,15,0.80) 0%, rgba(11,11,15,0.5) 40%, rgba(11,11,15,0) 100%); }
  .day { position:absolute; left:74px; top:258px; font-family: ui-monospace, Menlo, monospace;
    font-size:34px; letter-spacing:.16em; text-transform:uppercase; color:#ff7ba0; font-weight:800;
    text-shadow:0 2px 14px rgba(11,11,15,.98); }
  .stack { position:absolute; left:74px; right:74px; top:330px; height:780px;
    display:flex; flex-direction:column; justify-content:center; }
  h1 { font-size:116px; line-height:1.0; letter-spacing:-.035em; color:#f2f2f7; font-weight:800;
    text-shadow:0 3px 18px rgba(11,11,15,.95), 0 0 8px rgba(11,11,15,.85); }
  .g { color:#38d39f; }
</style>
